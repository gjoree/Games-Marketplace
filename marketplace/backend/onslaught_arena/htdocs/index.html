<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onslaught! Arena (dev)</title>
    <link href="css/horde.css" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>

    <script src="js/base.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/size.js"></script>
    <script src="js/vector2.js"></script>
    <script src="js/rect.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/mouse.js"></script>
    <script src="js/waves_full.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/object.js"></script>
    <!-- <script src="js/object_types.js"></script> -->
    <script src="js/image_loader.js"></script>
    <script src="js/spawn_point.js"></script>
    <script src="js/spawn_wave.js"></script>
    <script src="js/run_game.js"></script>
    <script>
      // Start session when page loads
      fetch('http://localhost:5059/api/sessions/start', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: 'arena' }),
      })

      // End session when the user leaves or reloads
      window.addEventListener('beforeunload', function () {
        navigator.sendBeacon(
          'http://localhost:5059/api/sessions/end',
          new Blob([JSON.stringify({ game: 'arena' })], {
            type: 'application/json',
          }),
        )
      })
    </script>
  </body>
</html>
