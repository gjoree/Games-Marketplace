<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sokoban</title>

    <script src="https://code.createjs.com/createjs-2015.11.26.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.4/lodash.min.js"></script>

    <script
      src="https://code.jquery.com/jquery-3.2.1.min.js"
      integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
      crossorigin="anonymous"
    ></script>

    <script
      src="https://code.jquery.com/ui/1.12.0/jquery-ui.min.js"
      integrity="sha256-eGE6blurk5sHj+rmkfsGYeKyZx3M4bG+ZlFyA7Kns7E="
      crossorigin="anonymous"
    ></script>

    <link
      href="https://fonts.googleapis.com/css?family=Raleway"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Sokoban</h1>
    </header>
    <div class="middle-container">
      <canvas id="canvas"> </canvas>

      <div id="dialog">
        <h3>Congratulations! You won!</h3>

        <img src="PNG/burgundy.jpg" width="400" />

        <button class="reset-game">Play Again</button>
      </div>

      <div class="bonus">
        <h2>Level: <span id="level-number">1</span> of 50</h2>
        <h2>Steps Taken: <span id="steps-taken">0</span></h2>
        <h2>Box Pushes: <span id="box-pushes">0</span></h2>
        <button id="reset-level">Reset Level</button>
        <!-- <button id="skip-level">Skip Level</button>
        <button class="reset-game">Reset Game</button> -->
      </div>
    </div>
    <script src="./dist/bundle.js"></script>
    <script>
      // Start session when page loads
      fetch('http://localhost:5059/api/sessions/start', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: 'sokoban' }),
      })

      // End session when the user leaves or reloads
      window.addEventListener('beforeunload', function () {
        navigator.sendBeacon(
          'http://localhost:5059/api/sessions/end',
          new Blob([JSON.stringify({ game: 'sokoban' })], {
            type: 'application/json',
          }),
        )
      })
    </script>
  </body>
</html>
